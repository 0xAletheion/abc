name: Rakuten Fullcount 1110 Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: rakuten-fullcount-1110-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered-page check
        id: monitor
        run: npm run check

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-check-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

      - name: Open or update qualifying deal alert
        if: steps.monitor.outputs.alert_triggered == 'true'
        uses: actions/github-script@v7
        env:
          LISTED_JPY: ${{ steps.monitor.outputs.listed_price_jpy }}
          EFFECTIVE_JPY: ${{ steps.monitor.outputs.effective_price_jpy }}
          JPY_PER_GBP: ${{ steps.monitor.outputs.jpy_per_gbp }}
          EFFECTIVE_GBP: ${{ steps.monitor.outputs.effective_price_gbp }}
          PRICE_TRIGGER: ${{ steps.monitor.outputs.price_trigger_met }}
          GBP_TRIGGER: ${{ steps.monitor.outputs.gbp_trigger_met }}
        with:
          script: |
            const title = 'Fullcount 1110 W33 deal available';
            const trigger = [
              process.env.PRICE_TRIGGER === 'true' ? 'listed price below ¥30,580' : null,
              process.env.GBP_TRIGGER === 'true' ? 'assumed-coupon price below £135' : null
            ].filter(Boolean).join(' and ');
            const body = [
              'W33 has been confirmed as selectable from the rendered Rakuten page, with an active purchase control.',
              '',
              `- Listed price: ¥${Number(process.env.LISTED_JPY).toLocaleString('en-GB')}`,
              `- Assumed coupon: ¥1,000`,
              `- Effective price: ¥${Number(process.env.EFFECTIVE_JPY).toLocaleString('en-GB')}`,
              `- Live GBP/JPY rate: ¥${Number(process.env.JPY_PER_GBP).toFixed(4)} per £1`,
              `- Effective GBP price: £${Number(process.env.EFFECTIVE_GBP).toFixed(2)}`,
              `- Trigger met: ${trigger}`,
              '',
              'Product: https://item.rakuten.co.jp/realmoon/1110w/',
              '',
              `Diagnostic run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issue = existing.find(i => !i.pull_request && i.title === title);

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Open or update diagnostic failure
        if: steps.monitor.outputs.error_present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Rakuten monitor needs attention';
            const body = [
              'The rendered-page monitor could not complete one or more required stages.',
              '',
              `Inspect the uploaded screenshot and result.json here: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issue = existing.find(i => !i.pull_request && i.title === title);

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
